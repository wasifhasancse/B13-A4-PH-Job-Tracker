<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- google fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

  <!-- fontawesome cdn -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- daisyui@5 and tailwindcss@4 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- favicon -->
  <link rel="shortcut icon" href="./assets/Logo.png" type="image/x-icon">
  <title>Job Tracker | Home</title>
</head>

<body class="font-[Geist] bg-gray-100">
  <!-- header section start -->
  <header class="container px-5 mx-auto pt-16">
    <section>
      <!-- header section title -->
      <h1 class="text-blue-950 text-5xl font-bold ">Job Application Tracker</h1>

      <!-- dashboard section start  -->
      <div class="py-10 grid grid-cols-3 gap-5">

        <!-- dashboard total count card start -->
        <div class="p-8 border-2 border-gray-200 bg-gray-50 rounded-lg">
          <p class="font-medium text-2xl mb-2.5">Total</p>
          <h2 class="font-bold text-4xl text-blue-950">8</h2>
        </div>
        <!-- dashboard total count card end -->

        <!-- dashboard Interview count card start -->
        <div class="p-8 border-2 border-gray-200 bg-gray-50 rounded-lg">
          <p class="font-medium text-2xl mb-2.5">Interview</p>
          <h2 class="font-bold text-4xl text-green-500">8</h2>
        </div>
        <!-- dashboard Interview count card end -->

        <!-- dashboard Rejected count card start -->
        <div class="p-8 border-2 border-gray-200 bg-gray-50 rounded-lg">
          <p class="font-medium text-2xl mb-2.5">Rejected</p>
          <h2 class="font-bold text-4xl text-red-500">8</h2>
        </div>
        <!-- dashboard Rejected count card end -->

      </div>
      <!-- dashboard section end -->
    </section>
  </header>
  <!-- header section end -->

  <!-- <div class="container px-5 mx-auto py-16 h-px bg-gray-200 "></div> -->

  <!-- Available Jobs start -->
  <main class="container px-5 mx-auto pt-16">
    
    <section>
      <!-- Available Jobs section title start -->
      <div class="flex justify-between items-center">
        <h2 class="text-2xl font-semibold text-blue-950">Available Jobs</h2>
        <p class="text-lg font-semibold text-gray-600"><span>8</span>&ensp;jobs</p>
      </div>
      <!-- Available Jobs section title end -->

      <!-- Button of Available Jobs section start -->
      <div class="py-5 flex items-center gap-5">
        <button
          class="py-5 px-10 border-2 border-gray-200 bg-gray-50 rounded-lg font-medium text-2xl w-60 text-gray-600">All</button>
        <button
          class="py-5 px-10 border-2 border-gray-200 bg-gray-50 rounded-lg font-medium text-2xl w-60 text-gray-600">Interview</button>
        <button
          class="py-5 px-10 border-2 border-gray-200 bg-gray-50 rounded-lg font-medium text-2xl w-60 text-gray-600">Rejected</button>
      </div>
      <!-- Button of Available Jobs section end -->
    </section>
    
  </main>
  <!-- Available Jobs end -->


  <script src="./js/machine.js"></script>
  <script src="./js/script.js"></script>
</body>

</html>
